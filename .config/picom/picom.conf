# Picom configuration for a clean, modern dwm tiling setup
# Compositor: picom-jonaburg-git

# ─────────────────────────────────────────────────────────────
# Backend / performance
# ─────────────────────────────────────────────────────────────
backend = "glx";
vsync = true;

use-damage = true;
glx-no-stencil = true;
glx-no-rebind-pixmap = true;
xrender-sync-fence = true;
unredir-if-possible = true;

detect-transient = true;
detect-client-leader = true;
mark-wmwin-focused = true;
mark-ovredir-focused = false;

log-level = "warn";

# ─────────────────────────────────────────────────────────────
# Shadows
# ─────────────────────────────────────────────────────────────
shadow = true;
shadow-radius = 14;
shadow-offset-x = -7;
shadow-offset-y = -7;
shadow-opacity = 0.30;

# Keep shadows off the dwm bar, fullscreen windows, notifications, etc.
shadow-exclude = [
  "window_type = 'desktop'",
  "window_type = 'dock'",
  "class_g = 'dwm'",
  "_NET_WM_STATE@:32a *= '_NET_WM_STATE_FULLSCREEN'",
  "class_g = 'Dunst'",
  "class_g *?= 'slop'",
  "_GTK_FRAME_EXTENTS@:c"
];

# ─────────────────────────────────────────────────────────────
# Fading
# ─────────────────────────────────────────────────────────────
fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;

# ─────────────────────────────────────────────────────────────
# Opacity
# ─────────────────────────────────────────────────────────────
active-opacity = 1.0;
inactive-opacity = 1.0;
frame-opacity = 1.0;

# Slightly stronger dimming on inactive windows so the focused one stands out.
inactive-dim = 0.3;

# ─────────────────────────────────────────────────────────────
# Rounded corners (subtle, modern, and out of the way)
# ─────────────────────────────────────────────────────────────
corner-radius = 8;

rounded-corners-exclude = [
  "window_type = 'desktop'",
  "window_type = 'dock'",
  "class_g = 'dwm'",
  "window_type = 'menu'",
  "window_type = 'tooltip'",
  "class_g = 'Dunst'",
  "class_g *?= 'slop'",
  "_NET_WM_STATE@:32a *= '_NET_WM_STATE_FULLSCREEN'"
];

# ─────────────────────────────────────────────────────────────
# Blur
# ─────────────────────────────────────────────────────────────
blur: {
  method = "dual_kawase";
  strength = 6;
  background = true;
  background-frame = false;
  background-fixed = false;
}

blur-background-exclude = [
  "window_type = 'desktop'",
  "window_type = 'dock'",
  "class_g = 'dwm'",
  "window_type = 'menu'",
  "window_type = 'tooltip'",
  "_GTK_FRAME_EXTENTS@:c",
  "class_g = 'Chromium'",
  "class_g = 'Discord'",
  "class_g = 'Dunst'",
  "class_g = 'Peek'",
  "class_g *?= 'slop'"
];

# ─────────────────────────────────────────────────────────────
# Animations (picom-jonaburg-git)
# ─────────────────────────────────────────────────────────────
animations = true;
animation-stiffness-in-tag = 125;
animation-stiffness-tag-change = 90;
animation-window-mass = 0.4;
animation-dampening = 15;
animation-clamping = true;

animation-for-open-window = "slide-up";
animation-for-unmap-window = "slide-down";
animation-for-transient-window = "slide-up";

animation-for-prev-tag = "minimize";
animation-for-next-tag = "slide-in-center";
enable-fading-prev-tag = true;
enable-fading-next-tag = true;

# ─────────────────────────────────────────────────────────────
# Window-type tweaks
# ─────────────────────────────────────────────────────────────
wintypes:
{
  tooltip = { fade = true; shadow = false; opacity = 0.85; focus = true; };
  dock = { opacity = 1.0; shadow = false; blur = false; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.85; shadow = false; };
  dropdown_menu = { opacity = 0.85; shadow = false; };
  menu = { opacity = 0.85; shadow = false; };
  dialog = { shadow = true; };
};

